name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # The suite is stdlib-only by design: no PySide6, no display, no Waydroid.
  # Green here proves the logic, never the target machine (see docs/TESTING.md).
  tests:
    name: pytest (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      # --tb=short and -ra keep the failure readable in the run summary; the
      # junit file is uploaded so a failure on one interpreter can be compared
      # with the others without re-running everything.
      - name: Environment
        run: |
          python -VV
          python -m pip list
      - name: Unit and contract tests
        run: python -m pytest -q --tb=long -ra --junitxml=junit-${{ matrix.python }}.xml -p no:cacheprovider
      # An annotation is visible without downloading anything; that is the
      # difference between a diagnosable failure and a red X.
      - name: Summarise failures
        if: failure()
        run: |
          python - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("junit-*.xml"):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for bad in case.findall("failure") + case.findall("error"):
                      msg = (bad.get("message") or "").splitlines()[:1]
                      print(f"::error title={case.get('classname')}.{case.get('name')}"
                            f"::{msg[0] if msg else 'failed'}")
          PY
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.python }}
          path: junit-${{ matrix.python }}.xml
          retention-days: 7
      - name: Architecture rules
        run: python -m pytest tests/test_layers.py -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned to the version this repository was verified with. Ruff adds
      # rules between minor releases, and an unpinned upgrade would turn a
      # green branch red without a code change.
      - run: python -m pip install 'ruff==0.17.4'
      - name: Lint
        run: ruff check src tests
      - name: Format check
        run: ruff format --check src tests

  types:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The GUI is type-checked too, so the stubs have to be present. The
      # package is installed but never imported at runtime in this job.
      - run: python -m pip install -e '.[dev,gui]'
      # Every module is checked, including the Qt widgets. PySide6 ships type
      # stubs, so there is no reason to exclude the GUI.
      - name: Type check
        run: mypy --strict src/lynxdroid

  # Proves the GUI dependency really is optional: the package must import and
  # run its CLI on a machine where PySide6 cannot be installed.
  no-qt:
    name: works without PySide6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Import everything except the Qt widgets
        run: |
          python - <<'PY'
          import importlib
          for name in ("lynxdroid", "lynxdroid.cli.main", "lynxdroid.doctor.platform",
                       "lynxdroid.display.geometry", "lynxdroid.input.engine",
                       "lynxdroid.profiles.store", "lynxdroid.backend.waydroid",
                       "lynxdroid.gui.viewmodel"):
              importlib.import_module(name)
          print("all non-Qt modules import")
          PY
      # This runner has no Waydroid, no binder and no GPU, so doctor exits
      # non-zero by design. The assertion is about the report, not the verdict.
      - name: CLI smoke test
        run: |
          lynxdroid version --json
          set +e
          lynxdroid doctor --json > doctor.json
          set -e
          python -c "import json;d=json.load(open('doctor.json'));print(len(d['checks']),'checks, schema',d['schema'])"
          python -c "
          import json;d=json.load(open('doctor.json'))
          assert d['checks'], 'empty report'
          "
      - name: GUI must fail with a clear message, not a traceback
        run: |
          set +e
          timeout 30 lynxdroid gui --offscreen > gui.log 2>&1
          code=$?
          echo "exit=$code"; cat gui.log
          # 3 = missing dependency. Anything else means the error handling
          # regressed, and a traceback would show up in gui.log.
          [ "$code" = "3" ] || { echo "expected exit 3 (missing dependency), got $code"; exit 1; }
          grep -qi "PySide6" gui.log || exit 1
          if grep -q "Traceback" gui.log; then echo "traceback leaked to the user"; exit 1; fi

  build:
    name: wheel build and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Install the wheel in a clean venv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/lynxdroid version
      # A runner has no Waydroid and no binder, so doctor legitimately exits 1
      # (failure) or 6 (blocked) here. What we assert is that the report is
      # well-formed and that the exit code is one of the documented values.
      - name: The doctor report from the wheel is valid JSON
        run: |
          set +e
          /tmp/venv/bin/lynxdroid doctor --json > /tmp/report.json
          code=$?
          set -e
          echo "doctor exit=$code"
          case "$code" in
            0|1|3|5|6) ;;
            *) echo "undocumented exit code $code"; exit 1 ;;
          esac
          python - <<'PY'
          import json
          report = json.load(open("/tmp/report.json"))
          assert report["schema"] == 1, report.get("schema")
          assert report["checks"], "report has no checks"
          statuses = {c["status"] for c in report["checks"]}
          assert statuses <= {"OK", "WARNING", "ERROR", "UNKNOWN"}, statuses
          print(f"valid report: {len(report['checks'])} checks, statuses {sorted(statuses)}")
          PY

  install-script:
    name: install script works on a clean machine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bash and check the script parses
        run: bash -n scripts/install.sh
      # The point of the script is that a fresh machine ends up with a
      # working install. Running it here is the only way to know that - it is
      # also why the script must never need sudo.
      - name: Run scripts/install.sh end to end
        run: ./scripts/install.sh
      - name: The installed command works
        run: |
          .venv/bin/lynxdroid version --json | python -c "import json,sys; print(json.load(sys.stdin)['version'])"

  # Docs and code must not drift apart: the requirement registry references
  # real test ids, and the schema versions must match what the code emits.
  docs:
    name: docs match code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # [dev] is needed for pytest itself: the last step counts the collected
      # tests and compares them with the number README advertises.
      - run: python -m pip install -e '.[dev]'
      # The version is single-sourced. pyproject and the package must agree,
      # and the CLI must report the same value it advertises.
      - name: Version is single-sourced
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from lynxdroid.version import SCHEMA_VERSIONS, __version__

          import tomllib
          pyproject = tomllib.loads(open("pyproject.toml", "rb").read().decode())
          project = pyproject["project"]
          # The version is dynamic on purpose: one source, read by the build.
          assert "version" in project.get("dynamic", []), (
              "pyproject should declare a dynamic version")
          assert "version" not in project, (
              "pyproject must not hardcode a version next to the dynamic one")
          configured = pyproject["tool"]["setuptools"]["dynamic"]["version"]["attr"]
          assert configured == "lynxdroid.version.__version__", configured

          reported = json.loads(
              subprocess.run([sys.executable, "-m", "lynxdroid", "version", "--json"],
                             capture_output=True, text=True, check=True).stdout)
          assert reported["version"] == __version__, reported
          assert reported["schemas"] == dict(SCHEMA_VERSIONS), reported["schemas"]
          print("version", __version__, "consistent; schemas", dict(SCHEMA_VERSIONS))
          PY

      - name: Schema versions match the documentation
        run: |
          python - <<'PY'
          from lynxdroid.version import SCHEMA_VERSIONS
          arch = open("docs/ARCHITECTURE.md", encoding="utf-8").read()
          assert '"schema": 1' in arch, "the profile example must show schema 1"
          for name, value in SCHEMA_VERSIONS.items():
              assert str(value) in arch or name not in arch, (
                  f"docs mention {name} but not its schema version {value}")
          print("documented schema versions agree with the code:", dict(SCHEMA_VERSIONS))
          PY
      - name: README and CLI agree on the test count
        run: |
          python - <<'PY'
          import re, subprocess, sys
          out = subprocess.run([sys.executable, "-m", "pytest", "-q", "--collect-only"],
                               capture_output=True, text=True).stdout
          collected = int(re.search(r"(\d+) tests? collected", out).group(1))
          readme = open("README.md", encoding="utf-8").read()
          documented = int(re.search(r"Unit tests \((\d+)\)", readme).group(1))
          assert collected == documented, (
              f"README says {documented} tests, pytest collects {collected}")
          print(f"{collected} tests, README agrees")
          PY
      - name: Every documented command exists
        run: |
          for cmd in doctor status start stop apps display profiles image perf gui version; do
            lynxdroid --help | grep -q "$cmd" || { echo "missing: $cmd"; exit 1; }
          done
          echo "all documented commands present"

  launcher-qt:
    name: Launcher Qt offscreen
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - run: python -m pip install -e '.[gui,dev]'
      - name: Require working Qt and test actual widgets
        run: |
          python -c 'from PySide6.QtWidgets import QApplication; app = QApplication([])' > qt-check.log 2>&1 || {
            python -c "from pathlib import Path; print('::error::Qt startup: ' + Path('qt-check.log').read_text()[-3500:].replace(chr(10), '%0A'))"
            exit 1
          }
          for test in test_navigation_and_disabled_launch test_import_search_and_remove_without_deleting_file test_fullscreen_and_escape; do
          python -X faulthandler -m pytest "tests/gui/test_launcher_ui.py::$test" -q --tb=short > qt-check.log 2>&1 || {
            status=$?
            export QT_TEST_EXIT="$status"
            python -c "import os; from pathlib import Path; print('::error::Qt tests exit ' + os.environ['QT_TEST_EXIT'] + ': ' + Path('qt-check.log').read_text()[-3500:].replace(chr(10), '%0A'))"
            echo "::error::Failing test: $test"
            exit "$status"
          }
          cat qt-check.log
          done
      - name: Capture launcher preview
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from PySide6.QtWidgets import QApplication
          from lynxdroid.core.paths import AppPaths
          from lynxdroid.gui.launcher import LauncherWindow
          app = QApplication([])
          with tempfile.TemporaryDirectory() as tmp:
              paths = AppPaths.resolve(Path(tmp))
              paths.ensure()
              window = LauncherWindow(paths)
              window.resize(1280, 800)
              window.show()
              app.processEvents()
              screenshot = window.grab()
              if not screenshot.save('launcher-preview.png'):
                  raise SystemExit('screenshot failed')
              screenshot.scaled(640, 400).save('launcher-small.jpg', quality=55)
              import base64
              encoded = base64.b64encode(Path('launcher-small.jpg').read_bytes()).decode()
              for i in range(0, len(encoded), 3000):
                  print(f'::notice title=preview-{i // 3000:03d}::' + encoded[i:i+3000])
              import shiboken6
              shiboken6.delete(window)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-preview
          path: launcher-preview.png
