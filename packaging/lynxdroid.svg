<?xml version="1.0" encoding="UTF-8"?>
<!-- LynxDroid's own mark: a phone outline on a letterboxed plate. Drawn as
     SVG so it stays sharp at 16 px in a task bar and at 512 px in a menu.
     Placeholder-quality on purpose: it is honest about being a first mark,
     and it exists so the desktop entry is not an empty square. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#12151b"/>
  <rect x="8" y="14" width="48" height="36" rx="3" fill="#000000"/>
  <rect x="17" y="18" width="30" height="28" rx="3" fill="#2b6cb0"/>
  <rect x="21" y="24" width="22" height="4" rx="2" fill="#e6edf3"/>
  <rect x="21" y="32" width="14" height="3" rx="1.5" fill="#a8b3c2"/>
  <rect x="21" y="38" width="18" height="3" rx="1.5" fill="#a8b3c2"/>
  <circle cx="52" cy="46" r="7" fill="#3fb950"/>
  <path d="M48.5 46.2l2.4 2.4 4.4-4.6" fill="none" stroke="#12151b" stroke-width="2.1"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
