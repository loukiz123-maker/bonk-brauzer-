<!doctype html>
<html>
<head>
  <title>JS demo</title>
  <style>
    body { font-family: serif; margin: 24px; }
    h1 { color: #123456; }
    .card { border: 1px solid #888; padding: 8px; margin: 6px 0; }
    .hot { background: #ffe0a0; }
  </style>
</head>
<body>
  <h1 id="title">Static heading</h1>
  <div id="list"></div>
  <p id="counter">0</p>
  <button id="bump">Bump</button>
  <script>
    var items = ['alpha', 'beta', 'gamma'];
    var list = document.getElementById('list');
    for (var i = 0; i < items.length; i++) {
      var card = document.createElement('div');
      card.className = 'card';
      card.textContent = (i + 1) + '. ' + items[i];
      list.appendChild(card);
    }
    document.getElementById('title').textContent = 'Built by our JS engine';
    document.title = 'JS demo (scripted)';

    var count = 0;
    var counter = document.getElementById('counter');
    var bump = document.getElementById('bump');
    bump.addEventListener('click', function() {
      count = count + 1;
      counter.textContent = 'clicks: ' + count;
      bump.classList.add('hot');
    });
    console.log('scripts ready, items =', items.length);
  </script>
</body>
</html>
