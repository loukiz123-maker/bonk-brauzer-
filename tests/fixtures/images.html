<!DOCTYPE html>
<html>
<head>
  <title>Images</title>
  <style>
    body { margin: 10px; font-family: sans-serif; font-size: 15px }
    img.scaled { width: 96px; height: 96px }
    img { border: 1px solid #444 }
    .row { margin: 8px 0 }
  </style>
</head>
<body>
  <h2>PNG decoding</h2>
  <div class="row">Scaled to 96px: <img class="scaled" src="logo.png" alt="logo"></div>
  <div class="row">Intrinsic 64x64: <img src="logo.png"></div>
  <p>Missing file stays a placeholder: <img src="nope.png" width="48" height="48"></p>
</body>
</html>
