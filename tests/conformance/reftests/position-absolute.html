<!DOCTYPE html>
<html><head><title>position-absolute</title></head>
<body style="margin:0;background:#fff">
  <div style="position:relative;width:200px;height:60px">
    <div style="position:absolute;left:0;top:0;width:100px;height:30px;background:#111"></div>
    <div style="position:absolute;left:100px;top:0;width:100px;height:30px;background:#555"></div>
    <div style="position:absolute;right:0;bottom:0;width:100px;height:30px;background:#999"></div>
  </div>
</body></html>
